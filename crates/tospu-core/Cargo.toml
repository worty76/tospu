[package]
name = "tospu-core"
version = "0.1.0"
edition = "2021"
description = "Pure logic for Tospu: settings, scheduling, sprite pack discovery. No GUI dependencies."

[dependencies]
tospu-model = { path = "../tospu-model" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
