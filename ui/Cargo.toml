[package]
name = "tospu-ui"
version = "0.1.0"
edition = "2021"
description = "Leptos/WASM UI for Tospu (popup and settings windows)."

[dependencies]
tospu-model = { path = "../crates/tospu-model" }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Location",
    "Element",
    "HtmlElement",
    "DomRect",
    "KeyboardEvent",
    "MediaQueryList",
    "Performance",
    "UrlSearchParams",
] }
