name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release that every platform uploads into, so parallel jobs
  # don't race to create it. It is published only after all builds succeed.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - id: release
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              return data.id;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const body = [
              "**macOS:** download the `.dmg`.",
              "**Windows (beta):** download the `-setup.exe` (or the `.msi`).",
              "**Linux (beta):** download the `.AppImage`, or the `.deb` / `.rpm` for your distribution.",
              "",
              "Tospu is not code-signed yet, so your system asks you to approve it the first time.",
              "See [how to open it](https://github.com/worty76/tospu#install).",
            ].join("\n");
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `Tospu ${tag}`, body, draft: true,
            });
            return data.id;

  build:
    needs: create-release
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build and upload Tospu
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
